<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dakatattoo - Tatuajes, Piercings y Micropigmentación en Zaragoza</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: #1f2833;
            --text-color: #c5c6c7;
            --text-light: #ffffff;
            --accent-color: #66fcf1;
            --accent-hover: #45c4be;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Cabecera / Hero */
        header {
            text-align: center;
            background-color: var(--surface-color);
            padding-bottom: 2rem;
            border-bottom: 2px solid var(--accent-color);
        }

        .hero-img {
            width: 100%;
            height: 450px;
            object-fit: cover;
            display: block;
        }

        .header-info {
            margin-top: 1.5rem;
            padding: 0 1rem;
        }

        .header-info h1 {
            font-size: 3rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
        }

        .header-info p {
            font-size: 1.2rem;
            color: var(--accent-color);
            font-weight: 500;
        }

        /* Navegación */
        nav {
            position: sticky;
            top: 0;
            background-color: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(5px);
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        nav ul {
            display: flex;
            justify-content: center;
            list-style: none;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        nav ul li {
            margin: 0 1.5rem;
        }

        nav ul li a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: var(--accent-color);
        }

        /* Contenedor Principal */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Secciones */
        .section-block {
            padding: 5rem 0 3rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section-block:last-child {
            border-bottom: none;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
            color: var(--text-light);
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
            text-transform: capitalize;
        }

        .section-header h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background-color: var(--accent-color);
            margin: 0.5rem auto 0 auto;
            border-radius: 2px;
        }

        .section-header .desc-principal {
            font-size: 1.15rem;
            max-width: 800px;
            margin: 0 auto;
            color: #a9b7c6;
        }

        /* Anuncios Alternos (Pares e Impares) */
        .anuncio-row {
            display: flex;
            align-items: center;
            margin-bottom: 4rem;
            gap: 3rem;
        }

        /* Impares (1º, 3º...): Imagen Izquierda, Texto Derecha */
        .anuncio-row.impar {
            flex-direction: row;
        }

        /* Pares (2º, 4º...): Imagen Derecha, Texto Izquierda */
        .anuncio-row.par {
            flex-direction: row-reverse;
        }

        .anuncio-img-wrapper {
            flex: 1;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .anuncio-img-wrapper img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .anuncio-img-wrapper img:hover {
            transform: scale(1.05);
        }

        .anuncio-text-wrapper {
            flex: 1;
        }

        .anuncio-text-wrapper h3 {
            font-size: 1.8rem;
            color: var(--text-light);
            margin-bottom: 1rem;
        }

        .anuncio-text-wrapper p {
            font-size: 1.05rem;
            color: var(--text-color);
        }

        /* Footer */
        footer {
            background-color: #050608;
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 4rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-img {
                height: 250px;
            }
            .header-info h1 {
                font-size: 2rem;
            }
            nav ul {
                flex-direction: column;
                align-items: center;
                padding: 0.5rem;
            }
            nav ul li {
                margin: 0.5rem 0;
            }
            .anuncio-row.impar, 
            .anuncio-row.par {
                flex-direction: column !important;
                gap: 1.5rem;
            }
            .anuncio-img-wrapper img {
                height: 250px;
            }
            .section-block {
                padding: 3rem 0 1rem 0;
            }
        }
    </style>
</head>
<body>

    <!-- Cabecera de la página -->
    <header>
        <!-- Imagen apaisada del local (puedes sustituir esta URL por una foto real de tu local en Zaragoza) -->
        <img class="hero-img" src="https://images.unsplash.com/photo-1590247813693-5541f1c609fd?auto=format&fit=crop&w=1600&q=80" alt="Local Dakatattoo Zaragoza">
        <div class="header-info">
            <h1>Dakatattoo</h1>
            <p>📍 Zaragoza, España</p>
        </div>
    </header>

    <!-- Menú de Navegación Dinámico -->
    <nav>
        <ul id="main-nav">
            <!-- Los enlaces se generarán dinámicamente con JS -->
        </ul>
    </nav>

    <!-- Contenido Principal Dinámico -->
    <main id="content-container">
        <!-- Las secciones y anuncios se cargarán aquí desde el JSON -->
    </main>

    <footer>
        <p>&copy; 2026 Dakatattoo Zaragoza. Todos los derechos reservados.</p>
    </footer>

    <script>
        // Carga y procesamiento del archivo JSON
        fetch('data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error("No se pudo cargar el archivo data.json");
                }
                return response.json();
            })
            .then(data => {
                const navContainer = document.getElementById('main-nav');
                const contentContainer = document.getElementById('content-container');

                data.secciones.forEach(seccion => {
                    // 1. Crear enlace en la barra de navegación
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `#${seccion.nombre}`;
                    a.textContent = seccion.nombre;
                    li.appendChild(a);
                    navContainer.appendChild(li);

                    // 2. Crear el bloque de la sección
                    const sectionBlock = document.createElement('section');
                    sectionBlock.id = seccion.nombre;
                    sectionBlock.className = 'section-block';

                    // Encabezado de la sección
                    const sectionHeader = document.createElement('div');
                    sectionHeader.className = 'section-header';
                    
                    const h2 = document.createElement('h2');
                    h2.textContent = seccion.titulo;
                    
                    const pDesc = document.createElement('p');
                    pDesc.className = 'desc-principal';
                    pDesc.textContent = seccion.descripcion;

                    sectionHeader.appendChild(h2);
                    sectionHeader.appendChild(pDesc);
                    sectionBlock.appendChild(sectionHeader);

                    // 3. Renderizar los anuncios aplicando la lógica par/impar
                    if (seccion.anuncios && seccion.anuncios.length > 0) {
                        seccion.anuncios.forEach((anuncio, index) => {
                            // El index en JS empieza en 0. 
                            // Index 0 -> Anuncio 1 (Impar) -> Imagen Izquierda
                            // Index 1 -> Anuncio 2 (Par)   -> Imagen Derecha
                            const esPar = (index + 1) % 2 === 0;
                            
                            const row = document.createElement('div');
                            row.className = `anuncio-row ${esPar ? 'par' : 'impar'}`;

                            // Contenedor de la Imagen
                            const imgWrapper = document.createElement('div');
                            imgWrapper.className = 'anuncio-img-wrapper';
                            const img = document.createElement('img');
                            img.src = anuncio.imagen;
                            img.alt = anuncio.titulo;
                            imgWrapper.appendChild(img);

                            // Contenedor del Texto
                            const textWrapper = document.createElement('div');
                            textWrapper.className = 'anuncio-text-wrapper';
                            const h3 = document.createElement('h3');
                            h3.textContent = anuncio.titulo;
                            const pAnuncio = document.createElement('p');
                            pAnuncio.textContent = anuncio.descripcion;
                            
                            textWrapper.appendChild(h3);
                            textWrapper.appendChild(pAnuncio);

                            // Unir todo a la fila (el orden visual real lo maneja el CSS con flex-direction: row o row-reverse)
                            row.appendChild(imgWrapper);
                            row.appendChild(textWrapper);
                            
                            sectionBlock.appendChild(row);
                        });
                    }

                    // Añadir sección completa al contenedor principal
                    contentContainer.appendChild(sectionBlock);
                });
            })
            .catch(error => {
                console.error("Error al procesar el JSON:", error);
                document.getElementById('content-container').innerHTML = `<p style="color: red; text-align: center;">Error al cargar la información del negocio.</p>`;
            });
    </script>
</body>
</html>
